<svg xmlns="http://www.w3.org/2000/svg" width="420" height="980" viewBox="0 0 420 980" role="img" aria-labelledby="title desc">
<title id="title">Choose and validate the right model detail</title>
<desc id="desc">AI workload and system choices lead to a choice among detailed simulation, sampled simulation, regression prediction, and lightweight modeling. A performance estimate must be validated for the design question; validation can lead to revisiting model detail. Akita, MGPUSim, and TrioSim are research simulation tools.</desc>
