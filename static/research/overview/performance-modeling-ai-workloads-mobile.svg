<text x="45" y="148" font-size="22" font-weight="400" fill="#12394b" text-anchor="start">Data / tensor / pipeline parallelism</text>
<text x="45" y="186" font-size="22" font-weight="400" fill="#12394b" text-anchor="start">Electrical / optical interconnects</text>
