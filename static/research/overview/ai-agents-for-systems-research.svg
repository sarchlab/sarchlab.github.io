<title id="title">Agent teams with human verification</title>
<desc id="desc">TheBotCompany explores self-organizing agent teams that plan, implement, and verify research software. Code, experiments, and results remain available for human inspection. Questions or decisions can be escalated to a human, whose corrections guide the next cycle.</desc>
