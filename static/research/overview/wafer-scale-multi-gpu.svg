<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Study data movement across tiles and GPUs</title>
<desc id="desc">Wafer-scale compute tiles and multiple GPUs create data-movement questions. Research studies address translation with HDPAT, page prefetching and layered translation with RIPPLE, and traffic on non-uniform-bandwidth networks with NetCrafter, including electrical and optical interconnect choices. The device drawings and arrows are conceptual.</desc>
